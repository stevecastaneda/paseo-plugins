<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Workspace links: two interlocked indigo chain links, on dark indigo. Tailwind indigo-400/900/950. Store icon; icon.png is this file rendered at 512 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="top"><rect x="224" y="196" width="64" height="44"/></clipPath>
    <clipPath id="bottom"><rect x="224" y="272" width="64" height="44"/></clipPath>
    <rect id="a" x="102" y="212" width="168" height="88" rx="44"/>
    <rect id="b" x="242" y="212" width="168" height="88" rx="44"/>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="rotate(-45 256 256)" fill="none" stroke-width="32">
    <!-- Each link has a gap where the other passes over it: B over A at the top crossing, A over B at the bottom. -->
    <mask id="under-b" maskUnits="userSpaceOnUse" x="-256" y="-256" width="1024" height="1024">
      <rect x="-256" y="-256" width="1024" height="1024" fill="#fff"/>
      <use href="#b" clip-path="url(#top)" fill="none" stroke="#000" stroke-width="56"/>
    </mask>
    <mask id="under-a" maskUnits="userSpaceOnUse" x="-256" y="-256" width="1024" height="1024">
      <rect x="-256" y="-256" width="1024" height="1024" fill="#fff"/>
      <use href="#a" clip-path="url(#bottom)" fill="none" stroke="#000" stroke-width="56"/>
    </mask>
    <use href="#a" stroke="#818cf8" mask="url(#under-b)"/>
    <use href="#b" stroke="#818cf8" mask="url(#under-a)"/>
  </g>
</svg>
