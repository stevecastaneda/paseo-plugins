<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- History: a stack of violet cards, on dark violet. Tailwind violet-300/400/500/900/950. Store icon; icon.png is this file rendered at 512 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect x="176" y="112" width="160" height="40" rx="20" fill="#c4b5fd" fill-opacity="0.7"/>
  <rect x="144" y="168" width="224" height="44" rx="22" fill="#a78bfa"/>
  <rect x="112" y="228" width="288" height="172" rx="36" fill="#8b5cf6"/>
  <rect x="152" y="276" width="152" height="26" rx="13" fill="#c4b5fd"/>
  <rect x="152" y="326" width="100" height="26" rx="13" fill="#c4b5fd"/>
</svg>
